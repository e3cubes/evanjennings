<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Water</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
<style>
  /* ---------- tokens ---------- */
  :root {
    --paper: #EAF1F0;
    --ink: #12343B;
    --ink-soft: #4C6A70;
    --water: #1F7A8C;
    --shutoff: #C8332B;
    --line: #C9D8D6;
    --panel: #F6FAF9;
    --ok: #2E7D4F;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --paper: #0E2328;
      --ink: #E3EEEC;
      --ink-soft: #9DB6B8;
      --water: #4FB3C6;
      --shutoff: #E8574D;
      --line: #24434A;
      --panel: #143038;
      --ok: #5CC489;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 1.0625rem;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 26rem;
    margin: 0 auto;
    padding: 2.25rem 1.5rem 2.5rem;
  }

  /* ---------- the tag (home name) ---------- */
  .tag {
    display: inline-flex;
    align-items: center;
    gap: .5rem;
    padding: .3rem .8rem .3rem .45rem;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    color: var(--ink-soft);
    font-size: .875rem;
    font-weight: 600;
  }
  .tag::before {
    content: "";
    width: .7rem; height: .7rem;
    border-radius: 50%;
    border: 2px solid currentColor;
  }
  .tag[hidden] { display: none; }

  h1 {
    font-size: 2.25rem;
    line-height: 1.08;
    letter-spacing: -0.02em;
    font-weight: 800;
    margin: 1.1rem 0 .6rem;
  }
  .lede { margin: 0 0 1.5rem; color: var(--ink-soft); }

  /* ---------- checklist (on only) ---------- */
  .checks {
    margin: 0 0 1.25rem;
    padding: .25rem 0;
    border: 0;
    background: var(--panel);
    border-radius: 14px;
  }
  .checks legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .check {
    display: flex;
    gap: .85rem;
    align-items: flex-start;
    padding: .85rem 1rem;
    cursor: pointer;
  }
  .check + .check { border-top: 1px solid var(--line); }
  .check input {
    appearance: none;
    flex: none;
    width: 1.5rem; height: 1.5rem;
    margin: .05rem 0 0;
    border: 2px solid var(--ink-soft);
    border-radius: 7px;
    display: grid;
    place-content: center;
    cursor: pointer;
  }
  .check input:checked { background: var(--water); border-color: var(--water); }
  .check input:checked::after {
    content: "";
    width: .45rem; height: .8rem;
    border: solid var(--paper);
    border-width: 0 3px 3px 0;
    transform: translateY(-2px) rotate(45deg);
  }
  .warn {
    margin: 0 0 2rem;
    font-size: .95rem;
    color: var(--ink-soft);
  }
  .warn strong { color: var(--ink); }

  /* ---------- the valve wheel ---------- */
  .valve {
    --accent: var(--water);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    width: 100%;
    margin: 0 auto;
    padding: 0;
    border: 0;
    background: none;
    color: var(--ink);
    font: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  body[data-mode="off"] .valve { --accent: var(--shutoff); }
  .wheel {
    width: min(64vw, 15rem);
    aspect-ratio: 1;
    color: var(--accent);
    transition: transform 1.6s cubic-bezier(.45,.05,.25,1), opacity .2s;
  }
  .valve-label {
    font-size: 1.35rem;
    font-weight: 800;
    padding: .7rem 1.6rem;
    border-radius: 999px;
    background: var(--accent);
    color: var(--paper);
  }
  .valve:focus-visible { outline: none; }
  .valve:focus-visible .valve-label { outline: 3px solid var(--ink); outline-offset: 4px; }
  .valve:disabled { cursor: not-allowed; }
  .valve:disabled .wheel { opacity: .35; }
  .valve:disabled .valve-label { background: var(--line); color: var(--ink-soft); }
  .valve.turning, .valve.done { cursor: default; }
  .valve.turning .wheel, .valve.done .wheel { opacity: 1; }
  body[data-mode="on"]  .valve.turning .wheel, body[data-mode="on"]  .valve.done .wheel { transform: rotate(-270deg); }
  body[data-mode="off"] .valve.turning .wheel, body[data-mode="off"] .valve.done .wheel { transform: rotate(270deg); }
  .valve.turning .valve-label, .valve.done .valve-label { background: var(--accent); color: var(--paper); }
  .hint { text-align: center; color: var(--ink-soft); font-size: .9rem; margin: .75rem 0 0; min-height: 1.4em; }

  /* ---------- result + contact ---------- */
  .result {
    margin: 2rem 0 0;
    padding: 1rem 1.1rem;
    border-radius: 14px;
    background: var(--panel);
    border-left: 5px solid var(--ok);
  }
  .result.error { border-left-color: var(--shutoff); }
  .result p { margin: 0; }
  .result p + p { margin-top: .35rem; color: var(--ink-soft); font-size: .95rem; }
  .result[hidden] { display: none; }

  .contact {
    display: flex;
    gap: .75rem;
    margin-top: 2.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--line);
  }
  .help {
    flex: 1;
    font: inherit;
    background: none;
    cursor: pointer;
    text-align: center;
    padding: .75rem;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    color: var(--ink);
    font-weight: 700;
    text-decoration: none;
  }
  .help:focus-visible { outline: 3px solid var(--water); outline-offset: 2px; }
  .help:disabled { cursor: default; color: var(--ink-soft); }

  .view[hidden], .contact[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .wheel { transition: opacity .2s; }
    body[data-mode] .valve.turning .wheel, body[data-mode] .valve.done .wheel { transform: none; }
  }

  /* ---------- choices: which water, what's happening ---------- */
  .group { margin: 0 0 1.5rem; padding: 0; border: 0; }
  .group legend { padding: 0; margin: 0 0 .6rem; font-weight: 700; }
  .opts { display: flex; flex-wrap: wrap; gap: .6rem; }
  .opt { position: relative; flex: 1 1 9rem; }
  .opt input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .opt span {
    display: block;
    padding: .8rem 1rem;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    font-weight: 700;
    text-align: center;
  }
  .opt input:checked + span { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .opt input[value="off"]:checked + span { background: var(--shutoff); border-color: var(--shutoff); }
  .opt input:focus-visible + span { outline: 3px solid var(--water); outline-offset: 2px; }
  .opt input:disabled { cursor: default; }
  /* ---------- demo banner ---------- */
  .demo {
    margin: 0 0 1.25rem;
    padding: .7rem .9rem;
    border: 1.5px dashed var(--water);
    border-radius: 12px;
    font-size: .92rem;
    color: var(--ink);
  }
  .demo strong { color: var(--water); }

  /* ---------- credit ---------- */
  .credit {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .5rem;
    margin-top: 2rem;
    color: var(--ink-soft);
    font-size: .8rem;
    text-decoration: none;
  }
  .credit img { height: 24px; width: auto; display: block; opacity: .85; }
  .credit .logo-dark { display: none; }
  @media (prefers-color-scheme: dark) {
    .credit .logo-light { display: none; }
    .credit .logo-dark { display: block; }
  }
  a.credit:hover img, a.credit:focus-visible img { opacity: 1; }
  a.credit:focus-visible { outline: 3px solid var(--water); outline-offset: 3px; border-radius: 6px; }

  .demo[hidden], .group[hidden], .contact[hidden], #control[hidden], #on-extra[hidden] { display: none; }
</style>
</head>
<body data-mode="">
<main>
  <p class="demo" id="demo" hidden><strong>Demo mode.</strong> Everything works except the last step: no real valve is connected, and nobody gets a text.</p>
  <span class="tag" id="home" hidden></span>

  <h1 id="title">Water</h1>
  <p class="lede" id="lede"></p>

  <fieldset class="group" id="pick" hidden>
    <legend>Which water?</legend>
    <div class="opts" id="pick-opts"></div>
  </fieldset>

  <fieldset class="group" id="choose" hidden>
    <legend>What’s happening?</legend>
    <div class="opts">
      <label class="opt"><input type="radio" name="mode" value="on"><span>The water is off</span></label>
      <label class="opt"><input type="radio" name="mode" value="off"><span>I see a leak</span></label>
    </div>
  </fieldset>

  <div id="on-extra" hidden>
    <fieldset class="checks">
      <legend>Before turning the water on</legend>
      <label class="check"><input type="checkbox" class="gate"> <span>No water on floors, ceilings or under any sinks</span></label>
      <label class="check"><input type="checkbox" class="gate"> <span>No faucets, toilets or hoses left running</span></label>
    </fieldset>
    <p class="warn"><strong>See water anywhere?</strong> Leave it off and tap “Ask <span class="owner-name"></span> for help” below.</p>
  </div>

  <div id="control" hidden>
    <button type="button" class="valve" id="valve">
      <svg class="wheel" viewBox="0 0 200 200" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-linecap="round">
          <circle cx="100" cy="100" r="82" stroke-width="16"/>
          <g stroke-width="12">
            <line x1="100" y1="100" x2="100" y2="22"/>
            <line x1="100" y1="100" x2="174" y2="76"/>
            <line x1="100" y1="100" x2="146" y2="163"/>
            <line x1="100" y1="100" x2="54"  y2="163"/>
            <line x1="100" y1="100" x2="26"  y2="76"/>
          </g>
        </g>
        <circle cx="100" cy="100" r="22" fill="currentColor"/>
        <circle cx="100" cy="100" r="8" fill="var(--paper)"/>
      </svg>
      <span class="valve-label" id="valve-label"></span>
    </button>
    <p class="hint" id="hint" aria-live="polite"></p>
  </div>

  <div class="result" id="result" role="status" hidden>
    <p id="result-main"></p>
    <p id="result-sub"></p>
  </div>

  <div class="contact" id="contact" hidden>
    <button type="button" class="help" id="help">Ask <span class="owner-name"></span> for help</button>
  </div>

<script>
/* ===================== CONFIG ===================== */
const CONFIG = {
  webhookUrl: "https://hooks.zapier.com/hooks/catch/21697097/41wevds/", // Zapier Catch Hook
  ownerName:  "Evan",
  creditUrl:  "https://www.quantify-consulting.com", // "Built by" credit link; blank = no link
  notifyOnOpen: true,  // also ping the Zap when the page is opened (you get an "opened" text)
  noCors: false        // set true only if presses work in Zapier but the page shows an error
};
/* ================================================== */
/*
  QR link format:
    ?t=<sticker token>&v=<Name>:<deviceId>[,<Name>:<deviceId>...][&a=on|off]
  t  identifies the printed sticker (Airtable decides which valves it may control)
  v  the valves to offer on this page; one valve = no picker
  a  optional: lock the sticker to one action; leave it off to let the guest choose
*/
(function () {
  const $ = (s) => document.querySelector(s);
  const params = new URLSearchParams(location.search);
  const demo   = params.has("demo");
  const token  = demo ? "demo-mode-no-valve-connected" : (params.get("t") || "").trim();
  const locked = (params.get("a") || "").toLowerCase();
  const valves = demo ? [{ name: "Main house", id: "demo-main" }, { name: "Rental", id: "demo-rental" }] :
    (params.get("v") || "").split(",").map((pair) => {
    const i = pair.lastIndexOf(":");
    return i > 0 ? { name: pair.slice(0, i).trim(), id: pair.slice(i + 1).trim() } : null;
  }).filter((v) => v && v.name && /^[0-9a-f-]{8,}$/i.test(v.id));

  // Optional link on the "Built by Quantify" credit
  if (CONFIG.creditUrl) {
    const old = $("#credit"), a = document.createElement("a");
    a.className = "credit"; a.id = "credit"; a.href = CONFIG.creditUrl; a.target = "_blank"; a.rel = "noopener";
    a.innerHTML = old.innerHTML; old.replaceWith(a);
  }
  if (demo) $("#demo").hidden = false;

  // Keep the code out of the address bar so it isn't copied along if someone shares the page.
  try { history.replaceState(null, "", location.pathname); } catch (_) {}
  document.querySelectorAll(".owner-name").forEach((el) => (el.textContent = CONFIG.ownerName));

  const title = $("#title"), lede = $("#lede");
  const lockOk = locked === "" || locked === "on" || locked === "off";
  if (token.length < 16 || !valves.length || !lockOk) {
    title.textContent = "This link is incomplete";
    lede.textContent = "Scan the code again. If it still doesn’t work, message " + CONFIG.ownerName + " the way you normally would.";
    return;
  }

  let mode = locked;                               // "on" | "off" | ""
  let device = valves.length === 1 ? valves[0] : null;

  function send(event) {
    if (demo) return new Promise((r) => setTimeout(r, 500));   // demo: never touches the network
    const body = new URLSearchParams({ t: token, event, a: mode, d: device ? device.id : "", at: new Date().toISOString() });
    const opts = { method: "POST", body, keepalive: true };
    if (CONFIG.noCors) opts.mode = "no-cors";
    return fetch(CONFIG.webhookUrl, opts).then((r) => {
      if (!CONFIG.noCors && !r.ok) throw new Error("HTTP " + r.status);
    });
  }
  if (CONFIG.notifyOnOpen) send("view").catch(() => {});

  // Which water (only when this sticker offers more than one valve)
  const tag = $("#home");
  if (device) { tag.textContent = device.name; tag.hidden = false; document.title = "Water · " + device.name; }
  else {
    const opts = $("#pick-opts");
    valves.forEach((v) => {
      const l = document.createElement("label"); l.className = "opt";
      const r = Object.assign(document.createElement("input"), { type: "radio", name: "valve", value: v.id });
      const s = document.createElement("span"); s.textContent = v.name;
      l.append(r, s); opts.append(l);
      r.addEventListener("change", () => { device = v; render(); });
    });
    $("#pick").hidden = false;
  }

  // What's happening (only when the sticker isn't locked to one action)
  if (!locked) {
    $("#choose").hidden = false;
    document.querySelectorAll('input[name="mode"]').forEach((r) =>
      r.addEventListener("change", () => { mode = r.value; render(); }));
  }

  const btn = $("#valve"), label = $("#valve-label"), hint = $("#hint");
  const gates = Array.from(document.querySelectorAll(".gate"));
  gates.forEach((g) => g.addEventListener("change", render));
  $("#contact").hidden = false;

  const COPY = {
    "":  { title: "Water", lede: "Choose what’s happening and the page will walk you through it." },
    on:  { title: "Turn the water back on", lede: "The water has been shut off. Check these two things first:", cta: "Turn water on" },
    off: { title: "Shut the water off", lede: "Use this if you see a leak or water where it shouldn’t be. The main valve closes within a minute.", cta: "Shut water off" }
  };

  function render() {
    if (btn.classList.contains("turning") || btn.classList.contains("done")) return;
    document.body.dataset.mode = mode;
    title.textContent = COPY[mode].title;
    lede.textContent = COPY[mode].lede;
    $("#on-extra").hidden = mode !== "on";
    $("#control").hidden = !mode;
    if (!mode) return;
    label.textContent = COPY[mode].cta;
    let why = "";
    if (!device) why = "Choose which water first";
    else if (mode === "on" && !gates.every((g) => g.checked)) why = "Tick both boxes to continue";
    btn.disabled = !!why;
    hint.textContent = why;
  }
  render();

  function showResult(ok, main, sub) {
    const box = $("#result");
    box.classList.toggle("error", !ok);
    $("#result-main").textContent = main;
    $("#result-sub").textContent = sub;
    box.hidden = false;
  }
  function lockInputs(on) { document.querySelectorAll("#pick input, #choose input, .gate").forEach((i) => (i.disabled = on)); }

  btn.addEventListener("click", () => {
    if (btn.disabled || btn.classList.contains("turning") || btn.classList.contains("done")) return;
    if (!navigator.onLine) { showResult(false, "Your phone is offline.", "Connect to Wi‑Fi or cellular data and try again."); return; }
    btn.classList.add("turning");
    label.textContent = mode === "on" ? "Turning on…" : "Shutting off…";
    hint.textContent = "";
    lockInputs(true);
    const minTurn = new Promise((r) => setTimeout(r, 1600)); // let the wheel finish its turn
    Promise.all([send("press"), minTurn]).then(() => {
      btn.classList.replace("turning", "done");
      btn.setAttribute("aria-disabled", "true");
      label.textContent = mode === "on" ? "Water on requested" : "Shut-off requested";
      showResult(true,
        mode === "on" ? device.name + ": water should flow again within a minute." : device.name + ": the main valve closes within a minute.",
        demo ? "Demo only. In real use, the valve moves and " + CONFIG.ownerName + " gets a text." : CONFIG.ownerName + " has been notified.");
    }).catch(() => {
      btn.classList.remove("turning");
      lockInputs(false);
      render();
      showResult(false, "The request didn’t go through.", "Check your connection and press again, or message " + CONFIG.ownerName + " the way you normally would.");
    });
  });

  const help = $("#help");
  help.addEventListener("click", () => {
    if (help.disabled) return;
    help.disabled = true;
    help.textContent = "Sending…";
    send("help").then(() => { help.textContent = demo ? "Demo: " + CONFIG.ownerName + " would get a text" : CONFIG.ownerName + " has been notified"; })
      .catch(() => { help.disabled = false; help.textContent = "Couldn’t send. Tap to try again"; });
  });
})();
</script>
</body>
</html>
